<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnword</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;800&family=Red+Hat+Text:wght@400;500;600&display=swap">
<style>
/* VOICE: a playful workshop tool, confident and quiet around the work
   IDEA: a lathe for letters: type goes in, spun shapes come out
   PICTURE: the live 2D/3D stage itself, large, first
   COLOUR and TYPE: cobalt + aqua on a deep night stage; Red Hat Display/Text
   LAYOUT: stage left, control panel right; stacked stage-then-panel on phones */
:root{color-scheme:light dark;--bg:light-dark(#eef0f4,#0b0e1a);--panel:light-dark(#ffffff,#131728);--ink:light-dark(#121528,#e9ecf7);--mute:light-dark(#5b6078,#9aa0bd);--line:light-dark(#dadde7,#262b44);--acc:light-dark(#3b4fd8,#8a97ff);--acc2:#4fc1c6;--chip:light-dark(#eef0f7,#1c2136)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Red Hat Text",system-ui,sans-serif;overflow-x:clip}
#app{display:grid;grid-template-rows:auto 1fr;height:100dvh}
header{display:flex;align-items:baseline;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header b{font:800 22px/1 "Red Hat Display",sans-serif;letter-spacing:-.01em}
header span{color:var(--mute);font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
#stage{position:relative;background:#0b0e1a;overflow:hidden;min-height:0}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.over{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}
.over>*{pointer-events:auto}
.pill{display:flex;background:rgba(10,12,24,.72);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px}
.pill button{all:unset;cursor:pointer;color:#cfd4ee;font:600 14px "Red Hat Text",system-ui,sans-serif;padding:8px 16px;border-radius:999px;min-height:20px}
.pill button.on{background:#e9ecf7;color:#0b0e1a}
.pill button:focus-visible{outline:2px solid var(--acc2)}
.views{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:center;pointer-events:none}
.views .pill{pointer-events:auto;overflow-x:auto;max-width:100%;scrollbar-width:none}
.views button{padding:8px 13px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#err{position:absolute;inset:0;display:none;place-items:center;color:#e9ecf7;padding:24px;text-align:center}
aside{background:var(--panel);border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;min-height:0}
nav{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{all:unset;cursor:pointer;padding:10px 12px;font:600 14px "Red Hat Text",system-ui,sans-serif;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc)}
nav button:focus-visible{outline:2px solid var(--acc)}
#ctl{overflow-y:auto;padding:6px 16px 40px}
h3{font:800 13px/1 "Red Hat Display",system-ui,sans-serif;color:var(--mute);margin:20px 0 6px;letter-spacing:.01em}
.row{display:block;padding:7px 0}
.lab{display:flex;justify-content:space-between;gap:8px;font-weight:500;margin-bottom:4px}
.lab output{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--acc);height:28px;margin:0}
select,textarea{width:100%;font:16px "Red Hat Text",system-ui,sans-serif;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:56px;font-weight:600}
select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{all:unset;cursor:pointer;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:500 14px "Red Hat Text",system-ui,sans-serif;min-height:20px;text-align:center}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer;font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.cols{display:flex;gap:14px;flex-wrap:wrap;padding:7px 0}
.cols label{display:flex;align-items:center;gap:8px;font-weight:500}
input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}
.note{color:var(--mute);font-size:13px;margin:2px 0 6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
pre.code{margin:8px 0 0;max-height:52vh;overflow:auto;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:2}
#msg{min-height:20px;color:var(--mute);font-size:14px;margin-top:8px}
#shot{position:fixed;inset:0;background:rgba(5,6,12,.85);display:none;place-items:center;z-index:9;padding:20px}
#shot div{max-width:min(92vw,900px);text-align:center;color:#e9ecf7}
#shot img{max-width:100%;max-height:70vh;border-radius:8px;display:block;margin:0 auto 12px}
@media(max-width:820px){
  #app{height:auto;min-height:100dvh}
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
  #stage{height:56vh;min-height:300px}
  aside{border-left:0;border-top:1px solid var(--line)}
  nav{position:sticky;top:0;background:var(--panel);z-index:2}
  header span{display:none}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="app">
  <header><b>Turnword</b><span>Type a word, style it, then spin its outline around any axis.</span></header>
  <main>
    <div id="stage">
      <canvas id="c3"></canvas><canvas id="c2"></canvas>
      <div class="over">
        <div class="pill" id="vt"><button data-v="2d">2D</button><button data-v="3d">3D</button></div>
        <div class="pill"><button id="auto">Auto-spin</button><button id="recenter">Recenter</button></div>
      </div>
      <div class="views" id="hint"><div class="pill" id="vw"><button data-cv="front">Front</button><button data-cv="back">Back</button><button data-cv="left">Left</button><button data-cv="right">Right</button><button data-cv="top">Top</button><button data-cv="bottom">Bottom</button><button data-cv="iso">3/4</button></div></div>
      <div id="err">3D isn't available in this browser, but the 2D view still works.</div>
    </div>
    <aside><nav id="tabs"></nav><div id="ctl"></div></aside>
  </main>
</div>
<div id="shot"><div><img id="shotimg" alt="Your render"><p>Press and hold (or right-click) the image to save it.</p><button class="btn" id="shotx">Close</button></div></div>
<script>
{
const PI=Math.PI, $=s=>document.querySelector(s);
const FONTS=[['Archivo Black',''],['Bebas Neue',''],['Anton',''],['Inter','wght@100..900'],['Montserrat','wght@100..900'],['Raleway','wght@100..900'],['Oswald','wght@200..700'],['Playfair Display','wght@400..900'],['Fraunces','wght@100..900'],['Unbounded','wght@200..900'],['Big Shoulders Display','wght@100..900'],['Orbitron','wght@400..900'],['Fredoka','wght@300..700'],['Caveat','wght@400..700'],['Pacifico',''],['Lobster',''],['Monoton',''],['Press Start 2P',''],['Bungee',''],['Bungee Shade',''],['Rubik Mono One',''],['Abril Fatface',''],['Permanent Marker',''],['Black Ops One',''],['Righteous',''],['Shrikhand',''],['UnifrakturMaguntia',''],['Cinzel Decorative','wght@400;700;900'],['Audiowide',''],['Rampart One',''],['Major Mono Display',''],['Georgia','sys'],['Impact','sys'],['serif','gen'],['monospace','gen']];
const D={text:'DAVID',font:'Archivo Black',weight:400,italic:false,tcase:'none',spacing:0.02,lineGap:1,align:'center',skew:0,arc:0,hollow:false,hollowW:6,
view:'3d',bg2:'#0b0e1a',fill:'gradient',fillA:'#4fc1c6',fillB:'#3b4fd8',strokeW:0,strokeC:'#ffffff',glow:0,copies:12,sweep2:360,pivotX:0,pivotY:-1,scaleStep:1,fade:0.45,hueStep:0,blend:'lighter',mirror:'none',spin2:0.15,zoom2:1,
mode:'revolve',axisAngle:0,axisOff:-1,axisTilt:0,sweep:360,steps:72,surf:true,ghosts:false,ghostEvery:6,trails:false,pts:false,every:4,animSweep:false,depth:0.6,twist:0,bendY:0,bendX:0,waveA:0,waveF:2,taper:0,copies3:1,rise:0,edges:false,detail:150,showAxis:true,showFlat:false,autoRot:0.15,autoOn:false,spin3:0,
mat:'chrome',cmode:'height',colA:'#4fc1c6',colB:'#3b4fd8',metal:1,rough:0.18,opacity:1,flat:false,lineC:'#ffffff',lineO:0.5,ptSize:2,bg3:'#0b0e1a',grid:false,codeFmt:'3d'};
let S={...D};
try{const j=JSON.parse(localStorage.getItem('turnword.v1')||'null');if(j)S={...D,...j}}catch(e){}
const MATP={chrome:{metal:1,rough:.18,opacity:1},clay:{metal:0,rough:.75,opacity:1},glass:{metal:0,rough:.05,opacity:.45},toon:{opacity:1},normal:{opacity:1},wire:{opacity:1}};
const PRESETS=[
['Spun from the bottom',{view:'3d',mode:'revolve',axisAngle:0,axisOff:-1,mat:'chrome',cmode:'height'}],
['Ring through the middle',{view:'3d',mode:'revolve',axisAngle:0,axisOff:0,mat:'glass',cmode:'rainbowH'}],
['Outline ghosts',{view:'3d',mode:'revolve',surf:false,ghosts:true,ghostEvery:2,steps:48,cmode:'rainbow',lineO:.7,axisOff:-1.4}],
['Light trails',{view:'3d',mode:'revolve',surf:false,trails:true,pts:true,every:3,steps:96,lineC:'#4fc1c6',lineO:.35,axisOff:0}],
['Donut',{view:'3d',mode:'revolve',axisOff:-2.6,mat:'clay',cmode:'radius',colA:'#f2a65a',colB:'#e8452c'}],
['Vertical spindle',{view:'3d',mode:'revolve',axisAngle:90,axisOff:0,mat:'chrome',cmode:'height'}],
['Half sweep, animated',{view:'3d',mode:'revolve',sweep:270,animSweep:true,mat:'normal'}],
['Twisted ribbon',{view:'3d',mode:'solid',depth:.3,twist:360,mat:'chrome',cmode:'sweep',autoRot:.25}],
['Ring wrap',{view:'3d',mode:'solid',depth:.5,bendY:360,mat:'clay',cmode:'rainbow'}],
['Globe-ish',{view:'3d',mode:'solid',depth:.3,bendY:360,bendX:150,mat:'chrome',cmode:'rainbowH'}],
['Carousel',{view:'3d',mode:'solid',depth:.4,copies3:8,axisAngle:90,axisOff:2.2,mat:'toon',cmode:'height'}],
['Spiral staircase',{view:'3d',mode:'solid',depth:.25,copies3:18,axisAngle:90,axisOff:1.2,rise:-.35,sweep:360,mat:'chrome',cmode:'sweep'}],
['Spirograph (2D)',{view:'2d',copies:24,pivotY:-1,pivotX:0,blend:'lighter',fade:.5,hueStep:12,fill:'gradient',spin2:.1}],
['Shrinking spiral (2D)',{view:'2d',copies:40,scaleStep:.93,sweep2:720,pivotY:-0.6,pivotX:-1,fade:.2,blend:'source-over',strokeW:2,fill:'rainbow',spin2:.2}],
['Kaleidoscope (2D)',{view:'2d',copies:6,mirror:'both',pivotY:-1.6,pivotX:0,blend:'screen',hueStep:30,glow:12,spin2:.08}]];

/* ---------- canvases ---------- */
const c2=$('#c2'),c3=$('#c3'),stage=$('#stage');
const MK=()=>document.createElement('canvas');
let MASK=MK(),STROKE=MK(),STY=MK();const TMP=MK(),SC=MK(),MEA=MK().getContext('2d');
let G=null,D2=1,stale=true,spin2A=0,spinA=0,tm=0;

/* ---------- fonts ---------- */
const loaded={};
function fontRec(){return FONTS.find(f=>f[0]===S.font)||FONTS[0]}
function fontStr(px){const f=fontRec();const fam=f[1]==='gen'?f[0]:`"${f[0]}"`;return `${S.italic?'italic ':''}${S.weight} ${px}px ${fam}, sans-serif`}
function ensureFont(){
  const f=fontRec();if(f[1]==='sys'||f[1]==='gen')return Promise.resolve();
  if(!loaded[f[0]])loaded[f[0]]=new Promise(res=>{const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(f[0]).replace(/%20/g,'+')+(f[1]?':'+f[1]:'')+'&display=block';l.onload=res;l.onerror=res;document.head.appendChild(l);setTimeout(res,5000)});
  return loaded[f[0]].then(()=>Promise.race([document.fonts.load(fontStr(60),S.text||'A'),new Promise(r=>setTimeout(r,4000))])).catch(()=>{});
}

/* ---------- text -> mask ---------- */
function bbox(cv){if(!cv.width)return null;const d=cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,cv.width,cv.height).data,w=cv.width,h=cv.height;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  return x1<0?null:[x0,y0,x1,y1]}
function buildMask(){
  let txt=S.text||'';if(S.tcase==='upper')txt=txt.toUpperCase();if(S.tcase==='lower')txt=txt.toLowerCase();
  const F=200;MEA.font=fontStr(F);const lines=txt.split('\n'),lh=F*S.lineGap,sp=S.spacing*F,arc=S.arc*PI/180;
  const info=lines.map(ln=>{const ch=[...ln],ws=ch.map(c=>MEA.measureText(c).width);const whole=!arc&&Math.abs(sp)<.01;const tot=whole?MEA.measureText(ln).width:ws.reduce((a,b)=>a+b,0)+sp*Math.max(0,ch.length-1);return{ln,ch,ws,whole,tot}});
  const maxW=Math.max(0,...info.map(i=>i.tot));const gl=[];let mnX=1e9,mxX=-1e9,mnY=1e9,mxY=-1e9;
  const grow=(x,y,r)=>{mnX=Math.min(mnX,x-r);mxX=Math.max(mxX,x+r);mnY=Math.min(mnY,y-r);mxY=Math.max(mxY,y+r*.6)};
  info.forEach((L,li)=>{if(!L.ch.length)return;const y0=li*lh;const xc=S.align==='left'?(L.tot-maxW)/2:S.align==='right'?(maxW-L.tot)/2:0;
    if(L.whole){gl.push({t:L.ln,x:xc,y:y0,r:0});mnX=Math.min(mnX,xc-L.tot/2-F*.4);mxX=Math.max(mxX,xc+L.tot/2+F*.4);mnY=Math.min(mnY,y0-F*1.2);mxY=Math.max(mxY,y0+F*.6);return}
    let s=-L.tot/2;L.ch.forEach((c,k)=>{const mid=s+L.ws[k]/2;let x=mid,y=0,r=0;if(arc){const R=L.tot/arc,ph=mid/R;x=R*Math.sin(ph);y=R*(1-Math.cos(ph));r=ph}
      gl.push({t:c,x:xc+x,y:y0+y,r});grow(xc+x,y0+y-F*.35,L.ws[k]/2+F*.9);s+=L.ws[k]+sp})});
  if(!gl.length){MASK.width=0;STROKE.width=0;return}
  const pad=F*.3+S.strokeW*F/20+(S.hollow?S.hollowW*F/25:0)+Math.abs(S.skew)*4;
  const W0=mxX-mnX+2*pad,H0=mxY-mnY+2*pad,k=Math.min(1,3000/W0,3000/H0),cw=Math.ceil(W0*k),ch=Math.ceil(H0*k);
  const draw=(cv,mode,lw)=>{cv.width=cw;cv.height=ch;const c=cv.getContext('2d');c.setTransform(k,0,0,k,(pad-mnX)*k,(pad-mnY)*k);c.font=fontStr(F);c.textAlign='center';c.textBaseline='alphabetic';c.lineJoin='round';c.lineWidth=lw;c.fillStyle=c.strokeStyle='#fff';
    for(const g of gl){c.save();c.translate(g.x,g.y);c.rotate(g.r);if(S.skew)c.transform(1,0,Math.tan(-S.skew*PI/180),1,0,0);mode==='fill'?c.fillText(g.t,0,0):c.strokeText(g.t,0,0);c.restore()}};
  const m=MK(),st=MK();S.hollow?draw(m,'stroke',S.hollowW*F/50):draw(m,'fill',0);

  if(b2)b=[Math.min(b[0],b2[0]),Math.min(b[1],b2[1]),Math.max(b[2],b2[2]),Math.max(b[3],b2[3])];
  const p=6,x=Math.max(0,b[0]-p),y=Math.max(0,b[1]-p),w=Math.min(cw,b[2]+p)-x,h=Math.min(ch,b[3]+p)-y;
  const crop=src=>{const o=MK();o.width=w;o.height=h;if(src.width)o.getContext('2d').drawImage(src,-x,-y);return o};

}
function restyle(){
  const w=MASK.width,h=MASK.height;STY.width=w||1;STY.height=h||1;if(!w)return;const c=STY.getContext('2d');c.clearRect(0,0,w,h);
  const tint=(src,paint)=>{TMP.width=w;TMP.height=h;const t=TMP.getContext('2d');t.drawImage(src,0,0);t.globalCompositeOperation='source-in';t.fillStyle=paint(t);t.fillRect(0,0,w,h);c.drawImage(TMP,0,0)};
  if(S.strokeW>0&&STROKE.width)tint(STROKE,()=>S.strokeC);
  if(S.fill!=='none')tint(MASK,t=>{if(S.fill==='solid')return S.fillA;const g=t.createLinearGradient(0,0,w,h*.35);
    if(S.fill==='gradient'){g.addColorStop(0,S.fillA);g.addColorStop(1,S.fillB)}else for(let i=0;i<=6;i++)g.addColorStop(i/6,`hsl(${i*60},90%,60%)`);return g});
  D2=1;
}

/* ---------- 2D view ---------- */
function draw2D(){
  const ctx=c2.getContext('2d'),W=c2.width,H=c2.height;ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.filter='none';ctx.shadowBlur=0;
  ctx.fillStyle=S.bg2;ctx.fillRect(0,0,W,H);if(!MASK.width)return;
  const w=STY.width,h=STY.height,N=Math.max(1,S.copies|0),pv=N>1?{x:S.pivotX*w/2,y:-S.pivotY*h/2}:{x:0,y:0};
  let R=0;for(const [a,b] of [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]])R=Math.max(R,Math.hypot(a-pv.x,b-pv.y));
  const ss=S.scaleStep,maxS=Math.max(1,ss**(N-1));
  let k=(N>1||S.spin2)?Math.min(W,H)/2*.92/(R*(N>1?maxS:1)):Math.min(W/w,H/h)*.86;k*=S.zoom2;
  ctx.translate(W/2,H/2);ctx.scale(k,k);ctx.rotate(spin2A);
  const step=N>1?(S.sweep2%360===0?S.sweep2/N:S.sweep2/(N-1))*PI/180:0;
  const mir=[[1,1]];if(S.mirror==='x'||S.mirror==='both')mir.push([-1,1]);if(S.mirror==='y'||S.mirror==='both')mir.push([1,-1]);if(S.mirror==='both')mir.push([-1,-1]);
  ctx.globalCompositeOperation=S.blend;if(S.glow){ctx.shadowColor=S.fill==='solid'||S.fill==='gradient'?S.fillA:S.strokeC;ctx.shadowBlur=S.glow*devicePixelRatio}
  for(let i=0;i<N;i++){ctx.save();ctx.rotate(i*step);const s=ss**i;ctx.scale(s,s);ctx.globalAlpha=Math.max(.04,1-S.fade*i/N);if(S.hueStep)ctx.filter=`hue-rotate(${(i*S.hueStep)%360}deg)`;
    for(const m of mir){ctx.save();ctx.scale(m[0],m[1]);ctx.drawImage(STY,-w/2-pv.x,-h/2-pv.y);ctx.restore()}ctx.restore()}
}

/* ---------- outline extraction (marching squares) ---------- */
function extract(){
  if(!MASK.width)return null;
  const C=Math.max(20,S.detail|0),cell=MASK.width/C,Rr=Math.max(1,Math.round(MASK.height/cell)),gw=C+2,gh=Rr+2;
  SC.width=gw;SC.height=gh;const x=SC.getContext('2d',{willReadFrequently:true});x.clearRect(0,0,gw,gh);x.imageSmoothingQuality='high';x.drawImage(MASK,1,1,C,Rr);
  const px=x.getImageData(0,0,gw,gh).data,v=new Float32Array(gw*gh);for(let i=0;i<v.length;i++)v[i]=px[i*4+3]/255;
  const s=8/C,T=.5,segs=[],tris=[],X=i=>(i-gw/2)*s,Y=j=>(gh/2-j)*s;
  const cs=[[0,0],[1,0],[1,1],[0,1]],vs=[0,0,0,0],inn=[0,0,0,0];
  for(let j=0;j<gh-1;j++)for(let i=0;i<gw-1;i++){
    let n=0;for(let k=0;k<4;k++){vs[k]=v[(j+cs[k][1])*gw+i+cs[k][0]];inn[k]=vs[k]>=T;n+=inn[k]}
    if(!n)continue;

  const d=dist*zoom;cam.position.set(target.x+d*Math.sin(ph)*Math.sin(th),target.y+d*Math.cos(ph),target.z+d*Math.sin(ph)*Math.cos(th));cam.lookAt(target);

<\/script>`;
}
function cssCode(txt){
  const f=fontRec(),fam=f[1]==='gen'?f[0]:`'${f[0]}'`,N=Math.max(1,S.copies|0),step=N>1?(S.sweep2%360===0?S.sweep2/N:S.sweep2/(N-1)):0;
  const ox=(50+S.pivotX*50).toFixed(1),oy=(50-S.pivotY*50).toFixed(1);
  const blend={'source-over':'normal',lighter:'plus-lighter',xor:'normal'}[S.blend]||S.blend;
  const paint=S.fill==='none'?'color:transparent;':S.fill==='solid'?`color:${S.fillA};`:`background:linear-gradient(100deg,${S.fill==='gradient'?S.fillA+','+S.fillB:'hsl(0 90% 60%),hsl(60 90% 60%),hsl(120 90% 60%),hsl(180 90% 60%),hsl(240 90% 60%),hsl(300 90% 60%),hsl(360 90% 60%)'});-webkit-background-clip:text;background-clip:text;color:transparent;`;
  const mir=[[1,1]];if(S.mirror==='x'||S.mirror==='both')mir.push([-1,1]);if(S.mirror==='y'||S.mirror==='both')mir.push([1,-1]);if(S.mirror==='both')mir.push([-1,-1]);
  const t=S.tcase==='upper'?txt.toUpperCase():S.tcase==='lower'?txt.toLowerCase():txt,safe=esc(t);
  const spans=[];for(let i=0;i<N;i++)for(const m of mir)spans.push(`    <span style="--r:${+(i*step).toFixed(2)}deg;--s:${+(S.scaleStep**i).toFixed(4)};--mx:${m[0]};--my:${m[1]};opacity:${+Math.max(.04,1-S.fade*i/N).toFixed(3)}${S.hueStep?`;filter:hue-rotate(${(i*S.hueStep)%360}deg)${S.glow?` drop-shadow(0 0 ${S.glow/3}px ${S.fillA})`:''}`:''}">${safe}</span>`);
  const longest=Math.max(3,...t.split('\n').map(l=>[...l].length)),fs=Math.round(S.zoom2*(N>1?130:120)*5/Math.max(5,longest)),spin=S.spin2?`\n  animation:${'tw-spin'} ${(2*PI/Math.abs(S.spin2)).toFixed(1)}s linear infinite${S.spin2<0?' reverse':''};`:'';
  const link=fontLink();
  return `<!-- Turnword 2D (pure CSS): "${txt}" -->
${link?`<link rel="stylesheet" href="${link}">\n`:''}<div class="tw-stage">
  <div class="tw-ring">
${spans.join('\n')}
  </div>
</div>
<style>
.tw-stage{position:relative;height:480px;overflow:hidden;background:${S.bg2};display:grid;place-items:center}
.tw-ring{position:relative;width:0;height:0;isolation:isolate;${spin}}
.tw-ring span{
  position:absolute;left:0;top:0;white-space:pre;
  font:${S.italic?'italic ':''}${S.weight} ${fs}px/${S.lineGap} ${fam},sans-serif;
  letter-spacing:${S.spacing}em;text-align:${S.align};
  ${paint}${S.strokeW?`\n  -webkit-text-stroke:${(S.strokeW*fs/40).toFixed(1)}px ${S.strokeC};paint-order:stroke fill;`:''}${S.glow&&!S.hueStep?`\n  filter:drop-shadow(0 0 ${S.glow/3}px ${S.fillA});`:''}
  mix-blend-mode:${blend};
  transform-origin:${ox}% ${oy}%;
  transform:translate(-${ox}%,-${oy}%) rotate(var(--r)) scale(var(--s)) scale(var(--mx),var(--my))${S.skew?` skewX(${-S.skew}deg)`:''};
}
@keyframes tw-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.tw-ring{animation:none}}
</style>`;
}

/* ---------- saving ---------- */
let DLP=null;const getDL=()=>DLP||(DLP=(async()=>{try{return window.claude&&claude.use?await claude.use('downloads'):null}catch(e){return null}})());getDL();
const msg=t=>{const m=$('#msg');if(m)m.textContent=t};
const fname=()=>(S.text||'word').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,30).toLowerCase()||'word';
function plainDownload(name,data){try{const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);msg('Saved '+name);return true}catch(e){return false}}
async function offer(name,data,fallback){const dl=await getDL();if(!dl){if(window.self===window.top&&plainDownload(name,data))return;fallback?fallback():msg('Saving files isn\'t available in this view. Open the page in a browser to save.');return}
  try{await dl.save({filename:name,data});msg('Saved '+name)}catch(e){const c=e&&e.code;msg(c==='declined'?'Save cancelled.':c==='rate_limited'?'One moment, then try again.':c==='host_unavailable'?'This app can\'t save files; open the page in a browser.':'Couldn\'t save that file here.');if(fallback&&c!=='declined')fallback()}}
function savePNG(){let cv=c2;if(S.view==='3d'&&R3){R3.render(scene,cam);cv=c3}else draw2D();
  cv.toBlob(b=>{if(!b){msg('Couldn\'t capture the image.');return}offer(fname()+'-'+S.view+'.png',b,()=>{$('#shotimg').src=cv.toDataURL('image/png');$('#shot').style.display='grid'})},'image/png')}
$('#shotx').onclick=()=>$('#shot').style.display='none';
function saveSTL(){
  if(!R3){msg('3D isn\'t available here.');return}if(S.view!=='3d'){setView('3d')}
  root.updateMatrixWorld(true);const list=[];let n=0;
  root.children.forEach(o=>{if(o.isMesh&&o.userData.k==='surf'){const g=o.geometry,c=g.index?g.index.count:g.attributes.position.count;list.push([o,c]);n+=c/3|0}});
  if(!n){msg('Turn on a solid surface first (3D shape tab).');return}
  const buf=new ArrayBuffer(84+50*n),dv=new DataView(buf);const hd='Turnword '+fname();for(let i=0;i<hd.length&&i<80;i++)dv.setUint8(i,hd.charCodeAt(i));dv.setUint32(80,n,true);
  let off=84;const a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3(),e1=new THREE.Vector3(),e2=new THREE.Vector3();
  for(const [o,cnt] of list){const P=o.geometry.attributes.position,I=o.geometry.index,M=o.matrixWorld;
    for(let t=0;t+2<cnt;t+=3){const ia=I?I.getX(t):t,ib=I?I.getX(t+1):t+1,ic=I?I.getX(t+2):t+2;
      a.fromBufferAttribute(P,ia).applyMatrix4(M).multiplyScalar(10);b.fromBufferAttribute(P,ib).applyMatrix4(M).multiplyScalar(10);c.fromBufferAttribute(P,ic).applyMatrix4(M).multiplyScalar(10);
      e1.subVectors(b,a);e2.subVectors(c,a);e1.cross(e2).normalize();
      for(const v of [e1,a,b,c]){dv.setFloat32(off,v.x||0,true);dv.setFloat32(off+4,v.y||0,true);dv.setFloat32(off+8,v.z||0,true);off+=12}off+=2}}
  offer(fname()+'-3d.zip',zip(fname()+'.stl',new Uint8Array(buf)));
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function zip(name,data){let crc=0xFFFFFFFF;for(let i=0;i<data.length;i++)crc=CRC[(crc^data[i])&255]^(crc>>>8);crc=(crc^0xFFFFFFFF)>>>0;
  const nm=new TextEncoder().encode(name),lh=30+nm.length,ch=46+nm.length,out=new Uint8Array(lh+data.length+ch+22),dv=new DataView(out.buffer);
  const hdr=(o,central)=>{let p=o;dv.setUint32(p,central?0x02014b50:0x04034b50,true);p+=4;if(central){dv.setUint16(p,20,true);p+=2}dv.setUint16(p,20,true);dv.setUint16(p+2,0,true);dv.setUint16(p+4,0,true);dv.setUint16(p+6,0,true);dv.setUint16(p+8,33,true);dv.setUint32(p+10,crc,true);dv.setUint32(p+14,data.length,true);dv.setUint32(p+18,data.length,true);dv.setUint16(p+22,nm.length,true);dv.setUint16(p+24,0,true);p+=26;
    if(central){dv.setUint16(p,0,true);dv.setUint16(p+2,0,true);dv.setUint16(p+4,0,true);dv.setUint32(p+6,0,true);dv.setUint32(p+10,0,true);p+=14}out.set(nm,p)};
  hdr(0,false);out.set(data,lh);const cd=lh+data.length;hdr(cd,true);const e=cd+ch;dv.setUint32(e,0x06054b50,true);dv.setUint16(e+8,1,true);dv.setUint16(e+10,1,true);dv.setUint32(e+12,ch,true);dv.setUint32(e+16,cd,true);return out}
